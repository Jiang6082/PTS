name: PTS scan

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/scan-request"

permissions:
  contents: write

concurrency:
  group: pts-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore scan state (new/closed-role stability guard)
        uses: actions/cache@v4
        with:
          path: .scan-state
          key: pts-scan-state-${{ github.run_id }}
          restore-keys: pts-scan-state-
      - name: Self-test
        run: npm test
      - name: Configure git
        run: |
          git config user.name "PTS scan bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Scan and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run scan:all:publish
